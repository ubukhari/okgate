# okgate demo policy for the container: the fake CRM bundled with the CLI, behind the proxy in
# dry-run, so its tools show through okgate. Nothing here touches a real system.
#
#   docker run -i --rm okgate proxy --config /app/demo/okgate.yaml
version: 1
mode: dry-run
upstreams:
  - name: crm
    command: node
    args: [/app/dist/fixtures/crm-server.js]
approval:
  tools: [crm_delete_*]
caps:
  per_run: { tool_calls: 400, writes: 50, deletes: 10, emails: 5, spend_usd: 25 }
# The image runs as the unprivileged `node` user: keep state where it can write.
state: { dir: /tmp/okgate }
audit: { path: /tmp/okgate/audit.jsonl }
kill: { file: /tmp/okgate/KILL }
