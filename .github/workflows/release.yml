name: Release agentguard

# The tag that publishes server.json to the MCP Registry (agentguard-v<version>) also cuts a GitHub
# Release, with that version's section of apps/agentguard-cli/CHANGELOG.md as the notes. It uses
# the workflow's own GITHUB_TOKEN, so the release is authored by github-actions and needs no secret.
# Re-running it for an existing tag updates the release in place.
on:
  push:
    tags: ["agentguard-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing agentguard-v<version> tag to create or update the release for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Notes from the changelog
        run: |
          set -euo pipefail
          version="${TAG#agentguard-v}"
          pkg="$(jq -r .version apps/agentguard-cli/package.json)"
          if [ "$pkg" != "$version" ]; then
            echo "::error::tag $TAG, but apps/agentguard-cli/package.json is $pkg"
            exit 1
          fi
          # The section under "## <version> …" (or release-please's "## [<version>](…)") up to the
          # next "## " heading.
          awk -v v="$version" '
            /^## / {
              if (found) exit
              x = $2; sub(/^\[/, "", x); sub(/\].*$/, "", x)
              if (x == v) { found = 1; next }
            }
            found { print }
          ' apps/agentguard-cli/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no \"## $version\" section in apps/agentguard-cli/CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "npm: https://www.npmjs.com/package/@agentwares/agentguard/v/$version"
          } >> notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "agentguard $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" --title "agentguard $VERSION" --notes-file notes.md --verify-tag
          fi
