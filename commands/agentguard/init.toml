# /agentguard:init — put okgate in front of this project's MCP servers, in dry-run mode.
description = "Deprecated, use /okgate:init (agentguard is now okgate). Put okgate in front of this project's MCP servers in dry-run mode (writes okgate.yaml, rewrites the MCP config with a backup)."
prompt = """
agentguard is now okgate: tell the user once that /okgate:init is the same command; /agentguard:init is kept until at least 2027-01-15.

Set up okgate in this project. okgate is an open-source MCP policy proxy
(`@agentwares/agentguard` on npm, MIT): it sits between the agent and its MCP servers and enforces
one file, okgate.yaml (dry-run writes, spend caps, approvals for destructive tools, a loop
breaker, a kill switch, a hash-chained audit log). It runs on this machine, needs no account and
makes no LLM calls.

1. Before running anything, tell the user in two or three sentences what `init` changes:
   - it writes okgate.yaml in the current directory in dry-run mode (reads pass through;
     writes and spends are faked and recorded; nothing destructive runs upstream);
   - it backs up one MCP config to `*.okgate-backup` and replaces its servers with a single
     entry that starts `npx -y -p @agentwares/agentguard okgate proxy`;
   - `npx -y -p @agentwares/agentguard okgate init --undo` restores the backup.

2. Choose the config. Gemini CLI reads MCP servers from `.gemini/settings.json` in the project
   and from `~/.gemini/settings.json`. If `.gemini/settings.json` exists here and has an
   `mcpServers` block, use `--client .gemini/settings.json`. If the servers are only in
   `~/.gemini/settings.json`, ask the user before using `--client ~/.gemini/settings.json`: it is a
   user-level file that affects every project (a backup is kept). With neither, run init with no
   `--client` and it uses the first project-level config it finds (.mcp.json, .cursor/mcp.json,
   .vscode/mcp.json, mcp.json, .gemini/settings.json).

3. Run, from the project root, with the shell tool (the user confirms the command):
   npx -y -p @agentwares/agentguard@latest okgate init [--client <path>] {{args}}

4. Read the result back: open the okgate.yaml it wrote and summarise the mode, each upstream
   and its tool count, the tools under `approval.tools` (they will need a human), tools under
   `classify.write` that could not be classified, and `caps.per_run`. Quote any "could not
   connect" line. An upstream that Gemini reached over SSE (`url`, not `httpUrl`) will not
   connect: okgate speaks stdio and Streamable HTTP only. Do not switch `mode` to `enforce`
   or change caps unless the user asks.

5. Next steps for the user: restart Gemini CLI so it starts the proxy, run the agent once, then
   `/agentguard:report`. When the report looks right, set `mode: enforce` in okgate.yaml.
   Emergency stop: `npx -y -p @agentwares/agentguard okgate kill` (until `npx -y -p @agentwares/agentguard okgate resume`).
"""
